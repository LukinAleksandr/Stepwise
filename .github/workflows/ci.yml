name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve next version from merged branch
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=""
          for attempt in 1 2 3; do
            branch=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].head.ref // ""')
            [ -n "$branch" ] && break
            sleep 5
          done
          current=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)
          node scripts/next-version.mjs "$branch" "$current" | tee -a "$GITHUB_OUTPUT"

      - name: Tag and publish release
        if: steps.next.outputs.type != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.next.outputs.version }}" --target "${{ github.sha }}" --generate-notes

  build:
    needs: version
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx biome ci
      - run: npm run check:boundaries
      - run: npm run check:content
      - run: npm run build
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
